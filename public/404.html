<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>KM Store Irulam</title>
    <script type="text/javascript">
        // Single Page Apps for GitHub Pages
        // This script takes the current URL and redirects it to the index.html page
        // with the query parameter containing the requested path.
        var pathSegmentsToKeep = 1; // Keeps '/km-store' in the path

        var l = window.location;
        var redirectUrl = l.protocol + '//' + l.host + '/' +
          l.pathname.split('/')[1] + '/?p=/' +
          l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~');

        if (l.search) {
          redirectUrl += '&q=' + l.search.slice(1).replace(/&/g, '~and~');
        }

        window.location.replace(redirectUrl);
    </script>
</head>
<body>
</body>
</html>
